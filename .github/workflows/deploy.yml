# Requires Phase 5 (infra/, Terraform) to exist before this can succeed —
# until then this will fail cleanly at the "configure AWS credentials" step,
# which is expected and harmless (no partial/bad deploys happen).
#
# Repo secrets/variables this workflow needs, once Phase 5 is live:
#   AWS_DEPLOY_ROLE_ARN   - IAM role ARN for GitHub OIDC to assume (infra/ output)
#   AWS_REGION            - e.g. us-east-1
#   ECR_REPOSITORY        - ECR repo name (infra/ output)
#   APP_RUNNER_SERVICE_ARN - App Runner service ARN (infra/ output)
name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write # required for GitHub OIDC -> AWS role assumption
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Trigger App Runner deployment
        run: |
          aws apprunner start-deployment \
            --service-arn "${{ secrets.APP_RUNNER_SERVICE_ARN }}"
